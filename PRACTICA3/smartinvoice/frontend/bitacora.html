<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartInvoice - Bitacora</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-logo">SmartInvoice</div>
        <nav class="sidebar-nav">
            <a href="/dashboard.html">Panel Principal</a>
            <a href="/facturas.html">Facturas</a>
            <a href="/proveedores.html">Proveedores</a>
            <a href="/bitacora.html" class="activo">Bitacora</a>
            <a href="/reportes.html">Reportes</a>
        </nav>
        <div class="sidebar-footer">IA1 - USAC 2026</div>
    </aside>

    <div class="contenido-principal">
        <div class="topbar">
            <span class="topbar-titulo">Bitacora de Procesamiento</span>
            <div class="topbar-usuario">
                <span id="info-usuario">-</span>
                <button class="btn btn-secundario" onclick="cerrarSesion()" style="padding:5px 12px;font-size:12px;">Cerrar Sesion</button>
            </div>
        </div>

        <div class="pagina">
            <div class="tarjeta mb-16">
                <div class="tarjeta-cabecera">
                    <span class="tarjeta-titulo">Filtros</span>
                </div>
                <div class="tarjeta-cuerpo">
                    <div class="barra-filtros">
                        <div class="form-grupo">
                            <label class="form-etiqueta">Fecha inicio</label>
                            <input class="form-input" type="date" id="filtro-fecha-inicio">
                        </div>
                        <div class="form-grupo">
                            <label class="form-etiqueta">Fecha fin</label>
                            <input class="form-input" type="date" id="filtro-fecha-fin">
                        </div>
                        <div class="form-grupo">
                            <label class="form-etiqueta">Estado</label>
                            <select class="form-select" id="filtro-estado">
                                <option value="">Todos</option>
                                <option value="Procesado">Procesado</option>
                                <option value="Rechazado">Rechazado</option>
                                <option value="Error">Error</option>
                                <option value="RPA Ejecutado">RPA Ejecutado</option>
                                <option value="Generado">Generado</option>
                                <option value="Enviado">Enviado</option>
                            </select>
                        </div>
                        <div>
                            <button class="btn btn-primario" onclick="aplicarFiltros()">Filtrar</button>
                            <button class="btn btn-secundario" onclick="limpiarFiltros()" style="margin-left:8px;">Limpiar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tarjeta">
                <div class="tarjeta-cabecera">
                    <span class="tarjeta-titulo">Historial de Operaciones</span>
                    <button class="btn btn-secundario" onclick="cargarBitacora()" style="padding:5px 12px;font-size:12px;">Actualizar</button>
                </div>
                <div class="tabla-contenedor">
                    <table class="tabla">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Fecha y Hora</th>
                                <th>Documento</th>
                                <th>Estado</th>
                                <th>Resultado</th>
                                <th>Usuario</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-bitacora-body">
                            <tr><td colspan="6" class="cargador">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/bitacora.js"></script>
<script>
verificarAutenticacion();
mostrarInfoUsuario();
cargarBitacora();
</script>
</body>
</html>
