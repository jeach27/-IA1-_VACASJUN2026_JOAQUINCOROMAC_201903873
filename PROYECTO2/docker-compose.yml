services:
  smartwarehouse:
    build: .
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/dificultad')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
